<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Медицински оптик</title>
<meta name="description" content="Предмети, домашни, конспекти, изпити, записки и календар за специалност Медицински оптик.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0C17" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Оптик">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap">
<style>
/* базов ресет */
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none !important}
:root{
  --paper:#F5F4FA; --surface:#FFFFFF; --surface-2:#EFEDF7; --sunken:#E7E4F2;
  --line:#E2DEEE; --line-strong:#C9C2DE;
  --ink:#191630; --ink-2:#4B4568; --ink-3:#7B7498;
  --accent:#5B45D9; --accent-soft:#EAE6FB; --accent-ink:#3B2BA3;
  --teal:#0C8B7B; --teal-soft:#DCF1EE;
  --amber:#A86C05; --amber-soft:#FAEED8;
  --rose:#BF2F4B; --rose-soft:#FBE3E8;
  --sc-bg:94%; --sc-fg:33%; --sc-sat-bg:70%; --sc-sat-fg:58%; --sc-dot:52%; --sc-sat-dot:64%;
  --shadow:0 1px 2px rgba(25,22,48,.05), 0 10px 26px -18px rgba(25,22,48,.3);
  --shadow-lift:0 3px 8px rgba(25,22,48,.08), 0 30px 54px -26px rgba(25,22,48,.45);
  --glow:0 20px 50px -28px rgba(76,45,190,.85);
  --grad:linear-gradient(118deg, #7C58FF 0%, #A855D8 42%, #12A594 100%);
  --r:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0D0C17; --surface:#181628; --surface-2:#211E34; --sunken:#13111F;
  --line:#2C2841; --line-strong:#443E61;
  --ink:#F1EFF9; --ink-2:#B7B1CD; --ink-3:#847DA2;
  --accent:#9C89FF; --accent-soft:#251E47; --accent-ink:#C6B9FF;
  --teal:#44CCB8; --teal-soft:#0F312D; --amber:#E4AE53; --amber-soft:#332714;
  --rose:#F67A8F; --rose-soft:#3A1A23;
  --sc-bg:21%; --sc-fg:77%; --sc-sat-bg:35%; --sc-sat-fg:64%; --sc-dot:65%; --sc-sat-dot:60%;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -18px rgba(0,0,0,.9);
  --shadow-lift:0 3px 10px rgba(0,0,0,.55), 0 30px 54px -26px rgba(0,0,0,.95);
  --glow:0 20px 54px -30px rgba(124,88,255,.9);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --paper:#0D0C17; --surface:#181628; --surface-2:#211E34; --sunken:#13111F;
  --line:#2C2841; --line-strong:#443E61;
  --ink:#F1EFF9; --ink-2:#B7B1CD; --ink-3:#847DA2;
  --accent:#9C89FF; --accent-soft:#251E47; --accent-ink:#C6B9FF;
  --teal:#44CCB8; --teal-soft:#0F312D; --amber:#E4AE53; --amber-soft:#332714;
  --rose:#F67A8F; --rose-soft:#3A1A23;
  --sc-bg:21%; --sc-fg:77%; --sc-sat-bg:35%; --sc-sat-fg:64%; --sc-dot:65%; --sc-sat-dot:60%;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -18px rgba(0,0,0,.9);
  --shadow-lift:0 3px 10px rgba(0,0,0,.55), 0 30px 54px -26px rgba(0,0,0,.95);
  --glow:0 20px 54px -30px rgba(124,88,255,.9);
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; overflow-x:hidden;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.02em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none; padding:0;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
body{overscroll-behavior-y:contain}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
svg{display:block}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

/* ===== shell ===== */
#app{min-height:100%; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:10px;
  padding:calc(11px + env(safe-area-inset-top, 0px)) 16px 11px;
  background:color-mix(in srgb, var(--paper) 82%, transparent);
  backdrop-filter:saturate(1.6) blur(16px); border-bottom:1px solid var(--line);
}
.mark{display:flex; align-items:center; gap:9px; min-width:0}
.lensmark{width:26px; height:26px; flex:none}
.mark .txt{min-width:0; flex:1}
.mark b{display:block; font-family:"Unbounded","Onest",sans-serif; font-weight:600; font-size:13.5px; letter-spacing:-.035em;
  line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (min-width:420px){ .mark b{font-size:15px} }
.mark span{display:block; font-size:10.5px; color:var(--ink-3); letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .spacer{flex:1}
.iconbtn{width:36px; height:36px; border-radius:12px; display:grid; place-items:center; flex:none;
  background:var(--surface); color:var(--ink-2); border:1px solid var(--line); transition:transform .14s, background .18s, color .18s}
.iconbtn:active{transform:scale(.92)}
.iconbtn.hot{background:var(--grad); color:#fff; border-color:transparent; box-shadow:var(--glow)}
.iconbtn svg{width:19px; height:19px}

main{flex:1; width:100%; max-width:1060px; margin:0 auto; padding:16px 16px 0}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom, 0px))}

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; justify-content:center; gap:3px;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom, 0px));
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:saturate(1.6) blur(18px); border-top:1px solid var(--line);
}
.tabbar button{
  position:relative; flex:1; max-width:96px; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 2px 6px; border-radius:13px; color:var(--ink-3); font-size:9.8px; font-weight:600; letter-spacing:0;
  transition:color .2s, background .25s, transform .14s;
}
.tabbar button:active{transform:scale(.93)}
.tabbar button svg{width:21px; height:21px; transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tabbar button.on{color:#fff; background:var(--grad); box-shadow:var(--glow)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.06)}
.tabbar button span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tabbar .badge{position:absolute; top:3px; right:calc(50% - 19px); min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--rose); color:#fff; font-size:10px; font-weight:700; display:grid; place-items:center; line-height:1;
  box-shadow:0 0 0 2px var(--paper)}
.tabbar button.on .badge{box-shadow:none; background:#fff; color:var(--accent-ink)}

@media (min-width:900px){
  .tabbar{top:0; bottom:0; right:auto; width:216px; flex-direction:column; justify-content:flex-start; gap:5px;
    padding:calc(72px + env(safe-area-inset-top,0px)) 14px 20px; border-top:none; border-right:1px solid var(--line);
    background:var(--surface-2); backdrop-filter:none}
  .tabbar button{flex:none; max-width:none; flex-direction:row; justify-content:flex-start; gap:12px; padding:11px 14px; font-size:14px; width:100%}
  .tabbar .badge{position:static; margin-left:auto; box-shadow:none}
  .topbar{padding-left:26px; z-index:50}
  #app{padding-left:216px}
  main{padding:24px 26px 0}
  body{padding-bottom:40px}
}

/* ===== entry animation ===== */
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
#view.anim > *{animation:rise .42s cubic-bezier(.2,.85,.25,1) both}
#view.anim > *:nth-child(2){animation-delay:.05s}
#view.anim > *:nth-child(3){animation-delay:.10s}
#view.anim > *:nth-child(4){animation-delay:.15s}
#view.anim > *:nth-child(5){animation-delay:.20s}
#view.anim > *:nth-child(6){animation-delay:.25s}
#view.anim > *:nth-child(n+7){animation-delay:.3s}

/* ===== hero ===== */
.hero{
  position:relative; overflow:hidden; border-radius:24px; padding:22px 20px 20px; color:#F2EEFF;
  background:#14112A; border:1px solid rgba(255,255,255,.09); box-shadow:var(--glow), 0 2px 10px rgba(12,9,26,.3);
  display:flex; gap:16px; align-items:center; flex-wrap:wrap;
}
.hero::before{
  content:""; position:absolute; inset:-60% -30% -30% -30%; pointer-events:none;
  background:
    radial-gradient(44% 50% at 16% 16%, rgba(124,88,255,.62), transparent 68%),
    radial-gradient(40% 48% at 86% 80%, rgba(18,165,148,.52), transparent 70%),
    radial-gradient(34% 38% at 68% 6%, rgba(232,108,180,.32), transparent 70%);
  animation:drift 22s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(-2%, -1%, 0) scale(1)} to{transform:translate3d(3%, 2%, 0) scale(1.08)}}
.hero > *{position:relative}
.hero-txt{flex:1 1 220px; min-width:0}
.hero .eyebrow{color:rgba(242,238,255,.62); margin-bottom:10px}
.hero h1{font-family:"Unbounded","Onest",sans-serif; font-weight:500; font-size:clamp(24px,7vw,35px); line-height:1.12; letter-spacing:-.045em}
.hero h1 em{font-style:normal; font-weight:700; background:linear-gradient(94deg,#C9B4FF,#6FE7D2); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero .sub{margin-top:10px; font-size:13.5px; color:rgba(242,238,255,.7); max-width:40ch}
.hero-legend{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap}
.leg{display:flex; align-items:center; gap:7px; font-size:11.5px; color:rgba(242,238,255,.72)}
.leg i{width:9px; height:9px; border-radius:3px; flex:none}
.leg b{color:#fff; font-weight:600}
.dial{flex:none; margin-inline:auto; filter:drop-shadow(0 8px 22px rgba(0,0,0,.35))}
.dial svg{width:clamp(150px,44vw,176px); height:clamp(150px,44vw,176px)}
.ring-track{fill:none; stroke:rgba(255,255,255,.1)}
.ring-val{fill:none; transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.dial .tick{stroke:rgba(255,255,255,.26); stroke-width:1.6; stroke-linecap:round}
.dial .tick.lit{stroke:rgba(190,160,255,.9); stroke-width:2.2}
.dial .big{font-family:"Unbounded","Onest",sans-serif; font-weight:600; font-size:31px; letter-spacing:-.04em; fill:#fff}
.dial .cap{font-size:9.5px; letter-spacing:.16em; fill:rgba(242,238,255,.55); text-transform:uppercase}

/* ===== primitives ===== */
.eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.sec{margin-top:24px}
.sec-head{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.sec-head .eyebrow{flex:1}
.linkbtn{font-size:13px; font-weight:700; color:var(--accent); white-space:nowrap; transition:opacity .15s}
.linkbtn:active{opacity:.6}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.stack{display:flex; flex-direction:column; gap:9px}
.grid{display:grid; gap:11px; grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.muted{color:var(--ink-3)} .tiny{font-size:12.5px}
.empty{border:1px dashed var(--line-strong); border-radius:var(--r); padding:22px 18px; text-align:center;
  color:var(--ink-3); font-size:13.5px; background:var(--surface-2)}
.empty b{display:block; color:var(--ink-2); font-size:14.5px; font-weight:600; margin-bottom:4px}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px;
  font-weight:600; background:var(--surface-2); color:var(--ink-2)}
.pill.rose{background:var(--rose-soft); color:var(--rose)}
.pill.amber{background:var(--amber-soft); color:var(--amber)}
.pill.teal{background:var(--teal-soft); color:var(--teal)}
.pill.accent{background:var(--accent-soft); color:var(--accent-ink)}
.pill.sample{background:transparent; border:1px dashed var(--line-strong); color:var(--ink-3); font-weight:500}
.tag{display:inline-flex; align-items:center; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700;
  background:hsl(var(--sh) var(--sc-sat-bg) var(--sc-bg)); color:hsl(var(--sh) var(--sc-sat-fg) var(--sc-fg))}
.glyph{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center; font-size:13px; font-weight:700;
  letter-spacing:-.03em; background:hsl(var(--sh) var(--sc-sat-bg) var(--sc-bg)); color:hsl(var(--sh) var(--sc-sat-fg) var(--sc-fg))}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 17px; border-radius:13px;
  font-size:14px; font-weight:700; background:var(--grad); color:#fff; box-shadow:var(--glow); transition:transform .14s, filter .2s}
.btn:active{transform:scale(.97); filter:brightness(1.08)}
.btn.sec{background:var(--surface); color:var(--ink); border:1px solid var(--line-strong); box-shadow:none}
.btn.quiet{background:var(--surface-2); color:var(--ink-2); box-shadow:none}
.btn.danger{background:transparent; color:var(--rose); border:1px solid var(--rose-soft); box-shadow:none}
.btn svg{width:17px; height:17px} .btn.wide{width:100%}

.bar{display:block; height:6px; border-radius:99px; background:var(--sunken); overflow:hidden}
.bar i{display:block; height:100%; border-radius:99px; background:var(--grad); width:0;
  transition:width .95s cubic-bezier(.2,.85,.2,1)}
.bar.hue i{background:hsl(var(--sh) var(--sc-sat-dot) var(--sc-dot))}
.bar.teal i{background:linear-gradient(90deg,var(--teal),#54D8C3)}
.barline{display:flex; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--ink-3); margin-bottom:6px}
.barline b{color:var(--ink-2); font-weight:600}

/* ===== stat strip ===== */
.stats{display:grid; grid-template-columns:repeat(2,1fr); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; background:var(--surface); box-shadow:var(--shadow)}
@media (min-width:620px){ .stats{grid-template-columns:repeat(4,1fr)} }
.stat{padding:13px 14px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:7px}
.stat:nth-child(2n){border-right:none}
.stat:nth-child(n+3){border-bottom:none}
@media (min-width:620px){
  .stat{border-bottom:none} .stat:nth-child(2n){border-right:1px solid var(--line)} .stat:last-child{border-right:none}
}
.stat .top{display:flex; align-items:baseline; gap:5px}
.stat b{font-family:"Unbounded","Onest",sans-serif; font-size:22px; font-weight:600; letter-spacing:-.045em; line-height:1}
.stat .of{font-size:12px; color:var(--ink-3); font-weight:500}
.stat span.lbl{font-size:10.5px; color:var(--ink-3); letter-spacing:.05em; text-transform:uppercase; font-weight:600}
.stat .bar{height:4px}

/* ===== task rows ===== */
.task{position:relative; display:flex; align-items:flex-start; gap:11px; padding:12px 13px; background:var(--surface);
  border:1px solid var(--line); border-radius:14px; transition:transform .16s, box-shadow .2s, border-color .2s; overflow:hidden}
.task::after{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; transition:background .25s}
.task.overdue::after{background:var(--rose)}
.task.soon::after{background:var(--amber)}
.task:hover{box-shadow:var(--shadow-lift); transform:translateY(-1px)}
.task.done{background:var(--surface-2); box-shadow:none; border-style:dashed}
.tick{width:22px; height:22px; flex:none; margin-top:1px; border-radius:8px; border:2px solid var(--line-strong);
  display:grid; place-items:center; color:transparent; transition:background .18s, border-color .18s, transform .18s}
.tick:active{transform:scale(.85)}
.tick svg{width:13px; height:13px}
.task.done .tick{background:linear-gradient(135deg,var(--teal),#4ED2BD); border-color:transparent; color:#fff}
@keyframes pop{0%{transform:scale(1)} 45%{transform:scale(1.35)} 100%{transform:scale(1)}}
.tick.just{animation:pop .42s cubic-bezier(.3,1.4,.5,1)}
.task-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.task-title{font-size:14.5px; font-weight:500; line-height:1.35; word-break:break-word}
.task.done .task-title{color:var(--ink-3); text-decoration:line-through; text-decoration-thickness:1.5px}
.task-meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.task-note{font-size:13px; color:var(--ink-2); white-space:pre-wrap; word-break:break-word}
.rowbtn{width:30px; height:30px; flex:none; border-radius:10px; display:grid; place-items:center; color:var(--ink-3); transition:background .18s,color .18s}
.rowbtn:hover{background:var(--surface-2); color:var(--ink)}
.rowbtn svg{width:16px; height:16px}
.daygroup{margin-bottom:13px}
.dayhead{display:flex; align-items:baseline; gap:8px; margin:0 3px 7px}
.dayhead b{font-size:13px; font-weight:700}
.dayhead span{font-size:12px; color:var(--ink-3)}

/* ===== week strip ===== */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.wday{display:flex; flex-direction:column; align-items:center; gap:6px; padding:9px 2px 8px; border-radius:12px;
  background:var(--surface-2); border:1px solid transparent; transition:transform .16s, border-color .2s}
.wday:hover{transform:translateY(-2px)}
.wday.today{border-color:var(--accent); background:var(--accent-soft)}
.wday .d{font-size:10px; color:var(--ink-3); font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.wday .n{font-size:15px; font-weight:700; letter-spacing:-.03em}
.wday .col{width:6px; border-radius:99px; background:var(--sunken); height:34px; display:flex; align-items:flex-end; overflow:hidden}
.wday .col i{width:100%; border-radius:99px; background:var(--grad); height:0; transition:height .9s cubic-bezier(.2,.85,.2,1)}
.wday.has .col{background:var(--sunken)}

/* ===== subject cards ===== */
.subj{position:relative; display:flex; flex-direction:column; gap:12px; padding:15px 14px 14px; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .22s}
.subj::before{content:""; position:absolute; inset:0 0 auto 0; height:3px;
  background:linear-gradient(90deg, hsl(var(--sh) var(--sc-sat-dot) var(--sc-dot)), transparent 92%)}
.subj:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.subj:active{transform:scale(.985)}
.subj-top{display:flex; gap:11px; align-items:flex-start}
.subj-top h3{font-size:15px; line-height:1.28; word-break:break-word}
.subj-top .who{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.subj-foot{display:flex; gap:12px; font-size:12px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:9px; margin-top:auto}
.miniring{flex:none; position:relative; width:44px; height:44px}
.miniring svg{width:44px; height:44px}
.miniring .ring-track{stroke:var(--sunken)}
.miniring .v{position:absolute; inset:0; display:grid; place-items:center; font-size:11px; font-weight:700; letter-spacing:-.03em}
.addcard{display:grid; place-items:center; gap:7px; min-height:130px; border-radius:var(--r); border:1.5px dashed var(--line-strong);
  color:var(--ink-3); font-size:13.5px; font-weight:700; transition:border-color .2s, color .2s, transform .16s}
.addcard:hover{border-color:var(--accent); color:var(--accent)}
.addcard:active{transform:scale(.98)}
.addcard svg{width:22px; height:22px}
.banner{display:flex; gap:11px; align-items:flex-start; padding:12px 13px; border-radius:14px; background:var(--accent-soft);
  color:var(--accent-ink); font-size:13px; margin-bottom:13px}
.banner>svg{width:18px; height:18px; flex:none; margin-top:2px}
.banner b{display:block; font-size:13.5px; margin-bottom:2px}
.banner button{font-weight:700; text-decoration:underline; text-underline-offset:3px; white-space:nowrap}

/* ===== subject detail ===== */
.back{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink-3); margin-bottom:12px; transition:color .15s}
.back:hover{color:var(--ink)}
.back svg{width:15px; height:15px}
.dhero{position:relative; overflow:hidden; border-radius:22px; padding:18px 16px; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow)}
.dhero::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(70% 120% at 8% 0%, hsl(var(--sh) 75% 55% / .2), transparent 62%)}
.dhero > *{position:relative}
.dhead{display:flex; gap:13px; align-items:flex-start}
.dhead .glyph{width:48px; height:48px; border-radius:14px; font-size:16px}
.dhead h1{font-size:clamp(20px,5.2vw,26px); line-height:1.18; letter-spacing:-.035em; word-break:break-word}
.dhead .who{font-size:13px; color:var(--ink-3); margin-top:3px}
.dstats{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
.dstat{flex:1 1 90px; padding:10px 12px; border-radius:13px; background:var(--surface-2); display:flex; flex-direction:column; gap:3px}
.dstat b{font-family:"Unbounded","Onest",sans-serif; font-size:19px; font-weight:600; letter-spacing:-.04em; line-height:1}
.dstat span{font-size:10px; color:var(--ink-3); letter-spacing:.05em; text-transform:uppercase; font-weight:600}
.kv{display:grid; grid-template-columns:minmax(92px,auto) 1fr; gap:9px 14px; font-size:14px; align-items:baseline}
.kv dt{font-size:11.5px; color:var(--ink-3); letter-spacing:.03em; text-transform:uppercase; font-weight:600}
.kv dd{margin:0; word-break:break-word; white-space:pre-wrap}
.kon{display:flex; flex-direction:column; margin-top:4px}
.kon button{display:flex; gap:10px; align-items:flex-start; padding:10px 2px; text-align:left; border-bottom:1px solid var(--line);
  font-size:14px; line-height:1.4; transition:padding-left .2s, background .2s; border-radius:6px}
.kon button:hover{background:var(--surface-2); padding-left:6px}
.kon button:last-child{border-bottom:none}
.kon .n{font-size:11px; color:var(--ink-3); min-width:20px; padding-top:3px; font-weight:700}
.kon .t{flex:1; word-break:break-word}
.kon button.done .t{color:var(--ink-3); text-decoration:line-through; text-decoration-thickness:1.5px}
.kon .tick{width:20px; height:20px; border-radius:7px; margin-top:1px}
.kon button.done .tick{background:linear-gradient(135deg,var(--teal),#4ED2BD); border-color:transparent; color:#fff}
.kon .next{box-shadow:inset 0 0 0 1.5px var(--accent); background:var(--accent-soft)}
.nextup{display:flex; gap:11px; align-items:center; padding:12px 13px; border-radius:14px; background:var(--accent-soft);
  color:var(--accent-ink); margin-bottom:12px}
.nextup .t{flex:1; min-width:0; font-size:13.5px; font-weight:600; line-height:1.35}
.nextup .t span{display:block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.7; font-weight:700; margin-bottom:2px}
.nextup button{flex:none; padding:8px 13px; border-radius:11px; background:var(--accent); color:#fff; font-size:12.5px; font-weight:700; transition:transform .14s}
.nextup button:active{transform:scale(.94)}

/* ===== notes ===== */
.note{position:relative; display:flex; flex-direction:column; gap:7px; padding:15px 14px; text-align:left; overflow:hidden;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .22s}
.note::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg, hsl(var(--sh,258) var(--sc-sat-dot) var(--sc-dot)), transparent 92%)}
.note:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.note h3{font-size:14.5px; line-height:1.3; word-break:break-word}
.note p{font-size:13px; color:var(--ink-2); line-height:1.5; white-space:pre-wrap; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.note .foot{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:auto; padding-top:3px}
.search{display:flex; align-items:center; gap:9px; padding:10px 14px; border-radius:14px; background:var(--surface);
  border:1px solid var(--line); margin-bottom:12px; transition:border-color .2s, box-shadow .2s}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:17px; height:17px; color:var(--ink-3); flex:none}
.search input{flex:1; min-width:0; border:none; background:none; outline:none; font-size:15px}
.segs{display:inline-flex; gap:3px; padding:3px; border-radius:13px; background:var(--sunken); margin-bottom:13px; flex-wrap:wrap}
.segs button{padding:7px 14px; border-radius:11px; font-size:13px; font-weight:700; color:var(--ink-3); transition:color .2s, background .25s}
.segs button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.filterchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:13px}
.fchip{padding:6px 12px; border-radius:99px; font-size:12.5px; font-weight:600; border:1px solid var(--line-strong);
  color:var(--ink-2); background:var(--surface); transition:all .18s}
.fchip.on{background:var(--grad); color:#fff; border-color:transparent; box-shadow:var(--glow)}

/* ===== файлове ===== */
.files{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.fileit{display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:6px 10px; border-radius:10px;
  background:var(--surface-2); border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--ink-2);
  text-decoration:none; transition:border-color .18s, color .18s, transform .14s}
.fileit:hover{border-color:var(--accent); color:var(--ink); transform:translateY(-1px)}
.fileit svg{width:14px; height:14px; flex:none; color:var(--ink-3)}
.fileit span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:168px}
.files .thumb{width:74px; height:74px; border-radius:12px; overflow:hidden; border:1px solid var(--line); display:block;
  transition:transform .16s, border-color .18s}
.files .thumb:hover{transform:translateY(-2px); border-color:var(--accent)}
.files .thumb img{width:100%; height:100%; object-fit:cover; display:block}
.clipill{display:inline-flex; align-items:center; gap:4px}
.clipill svg{width:12px; height:12px}
.filebox{display:flex; flex-direction:column; gap:8px}
.filelist{display:flex; flex-direction:column; gap:6px}
.filerow{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:11px; background:var(--surface-2); border:1px solid var(--line)}
.filerow svg{width:15px; height:15px; flex:none; color:var(--ink-3)}
.filerow .nm{flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-decoration:none; color:var(--ink)}
.filerow .sz{font-size:11px; color:var(--ink-3); flex:none}
.filerow.pending{opacity:.55}
.fileadd{display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:12px;
  border:1.5px dashed var(--line-strong); color:var(--ink-2); font-size:13.5px; font-weight:700; cursor:pointer;
  transition:border-color .2s, color .2s}
.fileadd:hover{border-color:var(--accent); color:var(--accent)}
.fileadd svg{width:16px; height:16px}
.fileerr{font-size:12px; color:var(--rose)}

/* ===== календар ===== */
.calhead{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.mnav{width:36px; height:36px; border-radius:12px; display:grid; place-items:center; flex:none;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2); transition:transform .14s, border-color .2s}
.mnav:hover{border-color:var(--accent); color:var(--accent)}
.mnav:active{transform:scale(.92)}
.mnav svg{width:17px; height:17px}
.mtitle{flex:1; text-align:center; min-width:0}
.mtitle b{display:block; font-family:"Unbounded","Onest",sans-serif; font-weight:600; font-size:17px; letter-spacing:-.035em; text-transform:capitalize}
.mtitle span{font-size:11px; color:var(--ink-3); letter-spacing:.08em}
.calwrap{display:grid; gap:14px; align-items:start}
@media (min-width:820px){ .calwrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.cwd{font-size:9px; font-weight:700; color:var(--ink-3); text-align:center; text-transform:uppercase; letter-spacing:.07em; padding-bottom:2px}
.cday{position:relative; aspect-ratio:1/1; border-radius:10px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; background:var(--surface-2); border:1.5px solid transparent;
  transition:transform .14s, background .2s, border-color .2s}
.cday:hover{transform:translateY(-2px)}
.cday:active{transform:scale(.94)}
.cday .n{font-size:12.5px; font-weight:600; line-height:1; letter-spacing:-.02em}
.cday.out{opacity:.32}
.cday.hol{background:var(--rose-soft)} .cday.hol .n{color:var(--rose)}
.cday.free{background:var(--amber-soft)} .cday.free .n{color:var(--amber)}
.cday.today{border-color:var(--accent)}
.cday.sel{background:var(--grad); border-color:transparent; box-shadow:var(--glow)}
.cday.sel .n{color:#fff}
.cday.sel .dot{background:rgba(255,255,255,.92)}
.dots{display:flex; gap:2.5px; height:5px; align-items:center}
.dsec{margin-top:17px}
.dsec:first-child{margin-top:0}
.dnote + .dsec{margin-top:0}
.dnote{display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border-radius:12px; margin-bottom:14px}
.dnote svg{width:17px; height:17px; flex:none; margin-top:2px}
.dnote b{display:block; font-size:13.5px; font-weight:700}
.dnote span{font-size:12.5px; opacity:.85}
.dnote.rose{background:var(--rose-soft); color:var(--rose)}
.dnote.amber{background:var(--amber-soft); color:var(--amber)}
.dot{width:4.5px; height:4.5px; border-radius:99px; background:var(--ink-3); flex:none}
.dot.exam{width:11px; background:var(--grad)}
.dot.ev{background:var(--amber)}
.callegend{display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:12px; padding-top:11px; border-top:1px solid var(--line);
  font-size:11px; color:var(--ink-3)}
.callegend span{display:inline-flex; align-items:center; gap:5px}
.callegend .sw{width:11px; height:11px; border-radius:4px; flex:none}
.dayp{padding:15px 14px}
.dayp .dh{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:4px}
.dayp .dh h3{font-size:15.5px; text-transform:capitalize}
.dayp .dh span{font-size:12.5px; color:var(--ink-3)}
.evrow{display:flex; gap:11px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:none; padding-bottom:0}
.evrow .mk{width:4px; border-radius:99px; align-self:stretch; min-height:34px; flex:none; background:var(--accent)}
.evrow .mk.rose{background:var(--rose)} .evrow .mk.amber{background:var(--amber)} .evrow .mk.grad{background:var(--grad)}
.evrow .eb{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.evrow .et{font-size:14.5px; font-weight:600; line-height:1.35; word-break:break-word}
.evrow .en{font-size:13px; color:var(--ink-2); white-space:pre-wrap; word-break:break-word}
.dayacts{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.dayacts .btn{flex:1; min-width:140px; padding:10px 14px; font-size:13.5px}

/* ===== статус на синхронизацията ===== */
.iconbtn.sync{position:relative}
.iconbtn.sync::after{content:""; position:absolute; right:4px; bottom:4px; width:8px; height:8px; border-radius:99px;
  background:var(--line-strong); box-shadow:0 0 0 2px var(--paper)}
.iconbtn.sync.ok::after{background:var(--teal)}
.iconbtn.sync.local::after{background:var(--ink-3)}
.iconbtn.sync.error::after{background:var(--rose)}
.iconbtn.sync.syncing::after{background:var(--amber); animation:pulsedot 1.1s ease-in-out infinite}
@keyframes pulsedot{0%,100%{opacity:1} 50%{opacity:.3}}
.authnote{font-size:13px; color:var(--ink-2); line-height:1.55}
.authnote b{color:var(--ink)}
.authrow{display:flex; gap:9px}
.authrow .btn{flex:1}

/* ===== confetti ===== */
#burst{position:fixed; inset:0; pointer-events:none; z-index:90; overflow:hidden}
.spark{position:absolute; width:7px; height:7px; border-radius:2px; will-change:transform,opacity; animation:fly .85s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(1); opacity:1} 100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0}}

/* ===== sheet ===== */
#overlay{position:fixed; inset:0; z-index:100; display:none}
#overlay.on{display:block}
.scrim{position:absolute; inset:0; background:rgba(14,12,24,.55); backdrop-filter:blur(3px); animation:fade .25s ease both}
@keyframes fade{from{opacity:0} to{opacity:1}}
.sheet{position:absolute; left:0; right:0; bottom:0; max-height:92%; display:flex; flex-direction:column; background:var(--surface);
  border-radius:24px 24px 0 0; border-top:1px solid var(--line); box-shadow:var(--shadow-lift);
  animation:up .32s cubic-bezier(.2,.9,.25,1) both}
@keyframes up{from{transform:translateY(40px); opacity:.4} to{transform:none; opacity:1}}
.sheet-head{display:flex; align-items:flex-start; gap:12px; padding:16px 18px 10px}
.sheet-head h2{font-size:17.5px; letter-spacing:-.025em}
.sheet-head p{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.sheet-body{overflow-y:auto; padding:4px 18px 16px; display:flex; flex-direction:column; gap:14px}
.sheet-foot{display:flex; gap:9px; padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line);
  background:var(--surface); border-radius:0 0 24px 24px}
.sheet-foot .btn{flex:1} .sheet-foot .btn.danger{flex:none; padding-inline:14px}
@media (min-width:720px){
  #overlay.on{display:grid; place-items:center; padding:24px}
  .sheet{position:relative; width:min(560px,100%); max-height:88vh; border-radius:20px; border:1px solid var(--line)}
  .sheet-foot{border-radius:0 0 20px 20px; padding-bottom:14px}
}
.fld{display:flex; flex-direction:column; gap:6px}
.fld>span{font-size:11.5px; font-weight:700; color:var(--ink-2); letter-spacing:.05em; text-transform:uppercase}
.fld input[type=text], .fld input[type=date], .fld input[type=email], .fld input[type=password], .fld select, .fld textarea{
  width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--surface-2);
  font-size:15px; outline:none; resize:vertical; transition:border-color .18s, background .18s, box-shadow .18s}
.fld input:focus, .fld select:focus, .fld textarea:focus{border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-soft)}
.fld .hint{font-size:11.5px; color:var(--ink-3); font-style:normal}
.chipset{display:flex; flex-wrap:wrap; gap:6px}
.chip-t{padding:8px 13px; border-radius:99px; font-size:13px; font-weight:600; border:1.5px solid var(--line-strong);
  color:var(--ink-2); background:var(--surface); transition:all .18s}
.chip-t.on{background:var(--grad); border-color:transparent; color:#fff; font-weight:700; box-shadow:var(--glow)}
.hues{display:flex; gap:8px; flex-wrap:wrap}
.hue{width:30px; height:30px; border-radius:10px; background:hsl(var(--sh) var(--sc-sat-dot) var(--sc-dot));
  border:2.5px solid transparent; transition:transform .16s}
.hue.on{border-color:var(--ink); transform:scale(1.08)}
.pickrow{display:flex; flex-direction:column; gap:8px}
.pickrow button{display:flex; align-items:center; gap:12px; padding:14px; border-radius:14px; border:1px solid var(--line);
  background:var(--surface-2); text-align:left; transition:transform .16s, border-color .2s}
.pickrow button:hover{border-color:var(--accent); transform:translateX(3px)}
.pickrow b{font-size:14.5px; font-weight:700; display:block}
.pickrow span{font-size:12.5px; color:var(--ink-3)}
.pickrow .glyph{background:var(--grad); color:#fff}
.pickrow .glyph svg{width:19px; height:19px}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="mark">
      <svg class="lensmark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7C58FF"/><stop offset=".5" stop-color="#A855D8"/><stop offset="1" stop-color="#12A594"/>
        </linearGradient></defs>
        <circle cx="20" cy="20" r="17" fill="none" stroke="url(#lg)" stroke-width="3"/>
        <circle cx="20" cy="20" r="8.5" fill="none" stroke="url(#lg)" stroke-width="2.4" opacity=".75"/>
        <circle cx="20" cy="20" r="3" fill="url(#lg)"/>
      </svg>
      <div class="txt"><b>Медицински оптик</b><span>МУ&#8209;Варна · първи курс</span></div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" data-act="settings" aria-label="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a1.9 1.9 0 0 1-3.8 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1h-.2a1.9 1.9 0 0 1 0-3.8h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5v-.2a1.9 1.9 0 0 1 3.8 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a1.9 1.9 0 0 1 0 3.8h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="iconbtn sync off" id="syncbtn" data-act="account" aria-label="Профил и синхронизация">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5a4.2 4.2 0 0 1-.3-8.4 5.6 5.6 0 0 1 10.8-1.3A3.9 3.9 0 0 1 17.8 18.5z"/></svg>
    </button>
    <button class="iconbtn hot" data-act="quick-add" aria-label="Добави">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabs"></nav>
</div>
<div id="burst"></div>
<div id="overlay" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* ========== състояние ========== */
const S = { subjects:{}, tasks:{}, notes:{}, events:{}, meta:{} };
const ui = { view:"today", subjectId:null, taskFilter:"open", search:"", noteSubject:"", subjSort:"name",
  hideBanner:false, calMonth:null, calDay:null };
let saveNotice = "";

const HUES = [258, 176, 209, 340, 28, 150, 288, 196];
const KINDS = ["Лекции","Упражнения","Учебна практика","Семинари"];
const MATERIALS = ["Купен учебник","Собствена тетрадка","Презентации от лектора","Ксерокопия","Онлайн ресурси","Атлас"];
const EXAM_FORMS = ["","Тест","Писмен изпит","Устен изпит","Практически изпит","Тест + устен","Текуща оценка","Колоквиум"];
const TASK_KINDS = ["Домашно","Реферат","Протокол","Тест","Колоквиум","Изпит","Друго"];
const MONTHS = ["яну","фев","март","апр","май","юни","юли","авг","сеп","окт","ное","дек"];
const WEEKDAYS = ["неделя","понеделник","вторник","сряда","четвъртък","петък","събота"];
const WD_SHORT = ["нд","пн","вт","ср","чт","пт","сб"];
const MONTHS_FULL = ["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];

const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => key(new Date());
const parseISO = s => { const p = String(s).split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); };
const plural = (n,one,many) => `${n} ${n===1?one:many}`;
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function daysUntil(iso){
  if (!iso) return null;
  const b = parseISO(iso); if (isNaN(b)) return null;
  return Math.round((b - parseISO(todayISO())) / 86400000);
}
const fmtDate = iso => { if(!iso) return ""; const d = parseISO(iso); return isNaN(d) ? "" : `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
function fmtDay(iso){
  const n = daysUntil(iso);
  if (n === 0) return "днес"; if (n === 1) return "утре"; if (n === -1) return "вчера";
  return WEEKDAYS[parseISO(iso).getDay()];
}
function dueMeta(iso){
  const n = daysUntil(iso);
  if (n === null) return { label:"без срок", tone:"" };
  if (n < 0) return { label: n === -1 ? "просрочено с 1 ден" : `просрочено с ${-n} дни`, tone:"rose" };
  if (n === 0) return { label:"днес", tone:"rose" };
  if (n === 1) return { label:"утре", tone:"amber" };
  if (n <= 6) return { label:`след ${n} дни`, tone:"amber" };
  return { label: fmtDate(iso), tone:"" };
}
function initials(name){
  const w = String(name||"?").trim().split(/\s+/).filter(x => x.length > 1);
  return w.length ? (w[0][0] + (w[1] ? w[1][0] : "")).toUpperCase() : "?";
}

const konPct = s => (s.konspekt||[]).length ? Math.round(konDone(s)/s.konspekt.length*100) : 0;
function konTotals(){
  let d = 0, t = 0;
  subjectsAll().forEach(s => { d += konDone(s); t += (s.konspekt||[]).length; });
  return { done:d, total:t, pct: t ? Math.round(d/t*100) : 0 };
}
function semester(){
  const m = S.meta || {};
  let start = m.semesterStart, end = m.semesterEnd;
  if (!start || !end){
    const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
    if (mo >= 8 || mo <= 1){ const sy = mo <= 1 ? y-1 : y; start = `${sy}-09-15`; end = `${sy+1}-02-10`; }
    else { start = `${y}-02-15`; end = `${y}-07-05`; }
  }
  const a = parseISO(start), b = parseISO(end), now = parseISO(todayISO());
  const span = Math.max(1, Math.round((b-a)/86400000));
  const gone = clamp(Math.round((now-a)/86400000), 0, span);
  return { start, end, pct: Math.round(gone/span*100), week: Math.floor(gone/7)+1, weeks: Math.ceil(span/7), left: Math.max(0, span-gone) };
}
function activity(){
  const m = {};
  const bump = ts => { if (!ts) return; const d = new Date(ts); if (isNaN(d)) return; const k = key(d); m[k] = (m[k]||0)+1; };
  Object.values(S.tasks).forEach(t => { if (t.done) bump(t.completedAt); });
  subjectsAll().forEach(s => (s.konspekt||[]).forEach(k => { if (k.done) bump(k.at); }));
  return m;
}
function streak(){
  const m = activity(), d = new Date();
  let n = 0;
  if (!m[key(d)]) d.setDate(d.getDate()-1);
  while (m[key(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* --- опашка от чакащи записи --- */
const outRead = () => { try{ return JSON.parse(localStorage.getItem(OUTBOX) || "[]"); }catch(e){ return []; } };
const outWrite = a => { try{ localStorage.setItem(OUTBOX, JSON.stringify(a)); }catch(e){} };
function queue(row){
  outWrite(outRead().filter(r => r.id !== row.id).concat([row]));
  if (supa && session){ setSync("syncing"); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 450); }
}
async function flush(){
  if (!supa || !session) return;
  const batch = outRead();
  if (!batch.length){ setSync("ok"); return; }
  try{
    const { error } = await supa.from("items").upsert(batch.map(r => ({
      user_id: session.user.id, id:r.id, kind:r.kind, data:r.data, updated_at:r.updated_at, deleted:r.deleted
    })), { onConflict:"user_id,id" });
    if (error) throw error;
  }catch(e){ setSync("error"); return; }
  const rest = outRead().filter(r => !batch.some(b => b.id === r.id && b.updated_at === r.updated_at));
  outWrite(rest);
  if (rest.length) flush(); else setSync("ok");
}

/* --- писане --- */
function put(coll, obj){
  obj.updatedAt = Date.now();
  S[coll][obj.id] = obj;
  localSave();
  queue({ id: coll + ":" + obj.id, kind: coll, data: obj, updated_at: obj.updatedAt, deleted:false });
  render();
}
function drop(coll, id){
  const now = Date.now();
  delete S[coll][id];
  localSave();
  queue({ id: coll + ":" + id, kind: coll, data:{ id }, updated_at: now, deleted:true });
  render();
}
function putMeta(obj){
  S.meta = Object.assign({}, S.meta, obj, { updatedAt: Date.now() });
  localSave();
  queue({ id:"meta:settings", kind:"meta", data:S.meta, updated_at:S.meta.updatedAt, deleted:false });
  render();
}

/* --- сливане на получените редове (печели по-новият запис) --- */
function applyRows(rows){
  let changed = false;
  (rows || []).forEach(r => {
    if (!r || !r.kind) return;
    if (r.kind === "meta"){
      if ((S.meta.updatedAt || 0) < r.updated_at){ S.meta = Object.assign({}, r.data, { updatedAt:r.updated_at }); changed = true; }
      return;
    }
    const coll = r.kind;
    if (!S[coll]) return;
    const lid = (r.data && r.data.id) || String(r.id).slice(coll.length + 1);
    const local = S[coll][lid];
    if (r.deleted){
      if (local && (local.updatedAt || 0) <= r.updated_at){ delete S[coll][lid]; changed = true; }
      return;
    }
    if (!local || (local.updatedAt || 0) < r.updated_at){
      S[coll][lid] = Object.assign({}, r.data, { id:lid, updatedAt:r.updated_at });
      changed = true;
    }
  });
  if (changed){ localSave(); render(); }
}
async function pullAll(){
  if (!supa || !session) return;
  setSync("syncing");
  try{
    const { data, error } = await supa.from("items").select("*");
    if (error) throw error;
    applyRows(data);
  }catch(e){ setSync("error"); return; }
  await flush();
}
function subscribeRealtime(){
  if (!supa || !session) return;
  try{ if (chan) supa.removeChannel(chan); }catch(e){}
  chan = supa.channel("items-" + session.user.id)
    .on("postgres_changes",
      { event:"*", schema:"public", table:"items", filter:"user_id=eq." + session.user.id },
      pl => applyRows([pl.new]))
    .subscribe();
}
async function initSync(){
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey){ setSync("off"); return; }
  if (!window.supabase || !window.supabase.createClient){ setSync("error"); return; }
  supa = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  try{
    const { data } = await supa.auth.getSession();
    session = (data && data.session) || null;
  }catch(e){ session = null; }
  supa.auth.onAuthStateChange((_e, sess) => {
    session = sess || null;
    if (session){ pullAll(); subscribeRealtime(); } else { setSync("local"); }
    render();
  });
  if (session){ setSync("syncing"); await pullAll(); subscribeRealtime(); }
  else setSync("local");
}
window.addEventListener("online", () => { if (supa && session) flush(); });
const canUpload = () => !!(supa && session);

/* --- файлове в облака --- */
const urlCache = {};
async function resolveFiles(){
  const els = [...document.querySelectorAll("[data-fpath]")];
  if (!els.length) return;
  if (!supa || !session) return;
  const now = Date.now();
  const need = [...new Set(els.map(e => e.dataset.fpath))].filter(x => !urlCache[x] || urlCache[x].exp < now);
  if (need.length){
    try{
      const { data } = await supa.storage.from("files").createSignedUrls(need, 3600);
      (data || []).forEach(d => { if (d && d.signedUrl) urlCache[d.path] = { url:d.signedUrl, exp: now + 3200000 }; });
    }catch(e){}
  }
  els.forEach(e => {
    const c = urlCache[e.dataset.fpath];
    if (!c) return;
    if (e.tagName === "IMG") e.src = c.url; else e.href = c.url;
  });
}

/* ========== анимации ========== */
const prevVal = {};
function ringSVG(k, pct, r, w, stroke, extra){
  const c = 2 * Math.PI * r;
  const p0 = prevVal["r:"+k] ?? 0;
  return `<circle class="ring-track" cx="0" cy="0" r="${r}" stroke-width="${w}" stroke="${extra&&extra.track||"var(--sunken)"}"/>
  <circle class="ring-val" data-ring="${k}" data-pct="${pct}" cx="0" cy="0" r="${r}" stroke-width="${w}" stroke="${stroke}"
    stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="${c.toFixed(1)}"
    stroke-dashoffset="${(c*(1-p0/100)).toFixed(1)}"/>`;
}
const barSVG = (k, pct, cls) => {
  const p0 = prevVal["b:"+k] ?? 0;
  return `<span class="bar ${cls||""}"><i data-bar="${k}" data-pct="${pct}" style="width:${p0}%"></i></span>`;
};
const numSVG = (k, n) => `<b data-num="${k}" data-to="${n}">${prevVal["n:"+k] ?? n}</b>`;

function settle(){
  const go = () => {
    document.querySelectorAll("[data-ring]").forEach(el => {
      const r = +el.getAttribute("r"), c = 2*Math.PI*r, p = +el.dataset.pct;
      el.style.strokeDashoffset = (c*(1-p/100)).toFixed(1);
      prevVal["r:"+el.dataset.ring] = p;
    });
    document.querySelectorAll("[data-col]").forEach(el => {
      el.style.height = el.dataset.pct + "%";
      prevVal["c:"+el.dataset.col] = +el.dataset.pct;
    });
    document.querySelectorAll("[data-bar]").forEach(el => {
      el.style.width = el.dataset.pct + "%";
      prevVal["b:"+el.dataset.bar] = +el.dataset.pct;
    });
    document.querySelectorAll("[data-num]").forEach(el => {
      const k = el.dataset.num, to = +el.dataset.to, from = prevVal["n:"+k] ?? 0;
      prevVal["n:"+k] = to;
      if (from === to || reduced()){ el.textContent = to; return; }
      const t0 = performance.now(), dur = 620;
      const step = t => {
        const p = clamp((t-t0)/dur, 0, 1), e = 1-Math.pow(1-p, 3);
        el.textContent = Math.round(from + (to-from)*e);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  };
  requestAnimationFrame(() => requestAnimationFrame(go));
}
function burst(x, y){
  if (reduced()) return;
  const host = document.getElementById("burst");
  const cols = ["#7C58FF","#A855D8","#12A594","#F2C14E","#EE6FA8"];
  for (let i = 0; i < 16; i++){
    const s = document.createElement("span");
    s.className = "spark";
    const a = Math.random()*Math.PI*2, d = 40 + Math.random()*70;
    s.style.left = x+"px"; s.style.top = y+"px";
    s.style.background = cols[i % cols.length];
    s.style.setProperty("--dx", Math.cos(a)*d + "px");
    s.style.setProperty("--dy", (Math.sin(a)*d + 30) + "px");
    s.style.setProperty("--rot", (Math.random()*540-270) + "deg");
    s.style.animationDelay = (Math.random()*70) + "ms";
    host.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
function burstAt(el){ const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2); }

}

function filesStrip(files, big){

/* ========== официални празници ========== */
function orthodoxEaster(y){
  const a = y % 4, b = y % 7, c = y % 19;
  const d = (19*c + 15) % 30, e = (2*a + 4*b - d + 34) % 7;
  const m = Math.floor((d + e + 114) / 31), day = ((d + e + 114) % 31) + 1;
  const dt = new Date(y, m - 1, day);
  dt.setDate(dt.getDate() + 13); // юлиански -> григориански
  return dt;
}
function buildHolidays(y){
  const H = {};
  const add = (d, name, kind) => { H[key(d)] = { name, kind: kind || "official" }; };
  const fixed = [
    [0,1,"Нова година"], [2,3,"Ден на Освобождението"], [4,1,"Ден на труда"],
    [4,6,"Гергьовден · Ден на храбростта"], [4,24,"Ден на българската просвета и култура"],
    [8,6,"Ден на Съединението"], [8,22,"Ден на Независимостта"],
    [11,24,"Бъдни вечер"], [11,25,"Рождество Христово"], [11,26,"Рождество Христово"]
  ];
  const marked = [];
  fixed.forEach(f => { const dt = new Date(y, f[0], f[1]); add(dt, f[2]); marked.push([dt, f[2]]); });
  const E = orthodoxEaster(y);
  const shift = (n, name) => { const d = new Date(E); d.setDate(E.getDate() + n); add(d, name); };
  shift(-2, "Велики петък"); shift(-1, "Велика събота"); shift(0, "Великден"); shift(1, "Втори ден на Великден");
  add(new Date(y, 10, 1), "Ден на народните будители", "edu");
  add(new Date(y, 11, 8), "Ден на студента", "edu");
  // чл. 154 КТ: официален празник в събота/неделя се измества напред
  marked.forEach(m => {
    const wd = m[0].getDay();
    if (wd !== 0 && wd !== 6) return;
    const nx = new Date(m[0]);
    do { nx.setDate(nx.getDate() + 1); } while (nx.getDay() === 0 || nx.getDay() === 6 || H[key(nx)]);
    add(nx, m[1] + " (преместен)", "shift");
  });
  return H;
}
const holCache = {};
function holidayOn(iso){
  const y = +String(iso).slice(0, 4);
  if (!y) return null;
  if (!holCache[y]) holCache[y] = buildHolidays(y);
  return holCache[y][iso] || null;
}

function taskRow(t, o){
  o = o || {};

  const late = !t.done && n !== null && n < 0, soon = !t.done && n !== null && n >= 0 && n <= 2;
  const bits = [];
  if (s) bits.push(`<span class="tag" style="--sh:${s.hue}">${esc(s.name)}</span>`);
  if (t.kind && t.kind !== "Домашно") bits.push(`<span class="pill">${esc(t.kind)}</span>`);
  if (!o.hideDue && t.due) bits.push(`<span class="pill ${m.tone}">${esc(m.label)}</span>`);
  if (t.sample) bits.push(`<span class="pill sample">примерна</span>`);
  return `<div class="task ${t.done?"done":""} ${late?"overdue":""} ${soon?"soon":""}">

function groupByDay(list){
  const m = new Map();
  list.forEach(t => { const k = t.due || ""; if (!m.has(k)) m.set(k, []); m.get(k).push(t); });
  return [...m.entries()].sort((a,b) => (a[0]||"9999").localeCompare(b[0]||"9999"));
}

      <div class="kon">${kon.map((k,i) => `<button class="${k.done?"done":""} ${i===nextI?"next":""}" data-act="toggle-kon" data-id="${s.id}" data-i="${i}" aria-pressed="${k.done}">
        <span class="n">${i+1}</span><span class="tick">${I.check}</span><span class="t">${esc(k.t)}</span></button>`).join("")}</div></div>`;
  } else {
    html += `<div class="empty">Постави въпросите от конспекта — по един на ред — и ги отмятай, докато учиш.</div>`;
  }
  html += `</section>`;

  html += `<section class="sec"><div class="sec-head"><p class="eyebrow">Задачи</p>
    <button class="linkbtn" data-act="new-task" data-subject="${s.id}">+ Задача</button></div>
    ${tasks.length ? `<div class="stack">${tasks.map(t => taskRow(t)).join("")}</div>` : `<div class="empty">Няма домашни или тестове по този предмет.</div>`}</section>`;

  html += `<section class="sec"><div class="sec-head"><p class="eyebrow">Записки</p>
    <button class="linkbtn" data-act="new-note" data-subject="${s.id}">+ Записка</button></div>
    ${notes.length ? `<div class="grid">${notes.map(noteCard).join("")}</div>` : `<div class="empty">Няма записки по този предмет.</div>`}</section>`;

  html += `<section class="sec" style="padding-bottom:8px"><button class="btn danger" data-act="del-subject" data-id="${s.id}">Изтрий предмета</button></section>`;
  return html;
}

/* ========== изглед: Задачи ========== */
function viewTasks(){
  const all = Object.values(S.tasks), f = ui.taskFilter;
  const doneN = all.filter(t => t.done).length;
  let list = f === "open" ? all.filter(t => !t.done) : f === "done" ? all.filter(t => t.done) : all;
  list = list.sort((a,b) => (a.done-b.done) || (a.due||"9999").localeCompare(b.due||"9999"));

  const today = parseISO(todayISO());
  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(today); d.setDate(today.getDate()+i);
    const k = key(d), n = all.filter(t => !t.done && t.due === k).length;
    return { k, n, d, today: i === 0 };
  });
  const maxN = Math.max(1, ...days.map(x => x.n));

  let html = `<section class="panel" style="padding:15px 14px">
    <div class="barline"><span>Отметнати задачи</span><b>${doneN} / ${all.length}</b></div>
    ${barSVG("tk-all", all.length ? Math.round(doneN/all.length*100) : 0, "teal")}
    <div class="week" style="margin-top:15px">${days.map(x => `<div class="wday ${x.today?"today":""} ${x.n?"has":""}">
      <span class="d">${WD_SHORT[x.d.getDay()]}</span>
      <span class="col"><i data-col="w-${x.k}" data-pct="${Math.round(x.n/maxN*100)}" style="height:0"></i></span>
      <span class="n">${x.n || "·"}</span></div>`).join("")}</div>
  </section>`;

  html += `<section class="sec"><div class="segs">
    ${[["open","Предстоящи"],["all","Всички"],["done","Готови"]].map(([v,l]) =>
      `<button data-act="task-filter" data-filter="${v}" class="${f===v?"on":""}">${l}</button>`).join("")}
  </div>`;
  if (!list.length){
    html += `<div class="empty"><b>${f==="done"?"Още нищо не е отметнато":"Няма задачи тук"}</b>${
      f==="done"?"Отметнатите домашни остават тук, ако ти потрябват.":"Добави домашно, реферат, протокол или тест и му сложи срок."}</div>`;
  } else if (f === "done"){
    html += `<div class="stack">${list.map(t => taskRow(t)).join("")}</div>`;
  } else {
    html += groupByDay(list).map(([d, items]) => `<div class="daygroup">
      <div class="dayhead"><b>${d?esc(fmtDay(d)):"Без срок"}</b><span>${d?esc(fmtDate(d)):""}</span></div>
      <div class="stack">${items.map(t => taskRow(t,{hideDue:true})).join("")}</div></div>`).join("");
  }
  html += `<div style="margin-top:14px"><button class="btn wide" data-act="new-task">${I.plus} Нова задача</button></div></section>`;
  return html;
}

/* ========== изглед: Записки ========== */
function noteCard(n){
  const s = S.subjects[n.subjectId];
  return `<button class="note" data-act="edit-note" data-id="${n.id}"${s?` style="--sh:${s.hue}"`:""}>
    <h3>${esc(n.title || "Без заглавие")}</h3>
    ${n.body ? `<p>${esc(n.body)}</p>` : ""}
    <span class="foot">${s ? `<span class="tag" style="--sh:${s.hue}">${esc(s.name)}</span>` : `<span class="pill">без предмет</span>`}
      ${clipPill(n.files)}${n.sample ? `<span class="pill sample">примерна</span>` : ""}</span>
  </button>`;
}
function viewNotes(){
  const q = ui.search.trim().toLowerCase();
  let list = Object.values(S.notes).sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0));
  if (ui.noteSubject) list = list.filter(n => n.subjectId === ui.noteSubject);
  if (q) list = list.filter(n => {
    const s = S.subjects[n.subjectId];
    return `${n.title} ${n.body} ${s?s.name:""}`.toLowerCase().includes(q);
  });
  const withNotes = subjectsSorted().filter(s => notesOf(s.id).length);

  let html = `<section><div class="search">${I.search}
    <input id="q" type="text" value="${esc(ui.search)}" placeholder="Търси в записките" aria-label="Търси в записките"></div>`;
  if (withNotes.length){
    html += `<div class="filterchips">
      <button class="fchip ${!ui.noteSubject?"on":""}" data-act="note-filter" data-subject="">Всички ${Object.keys(S.notes).length}</button>
      ${withNotes.map(s => `<button class="fchip ${ui.noteSubject===s.id?"on":""}" data-act="note-filter" data-subject="${s.id}">${esc(s.name)} ${notesOf(s.id).length}</button>`).join("")}
    </div>`;
  }
  html += list.length ? `<div class="grid">${list.map(noteCard).join("")}</div>`
    : `<div class="empty"><b>${q||ui.noteSubject?"Нищо не съвпада":"Още няма записки"}</b>${
        q||ui.noteSubject?"Опитай с друга дума или друг предмет.":"Пиши каквото се каже на лекция — после го търсиш по дума."}</div>`;
  html += `<div style="margin-top:14px"><button class="btn wide" data-act="new-note">${I.plus} Нова записка</button></div></section>`;
  return html;
}


/* ========== изглед: Календар ========== */
function eventMark(kind){ return kind === "Няма университет" ? "amber" : kind === "Бележка" ? "" : "grad"; }

function viewCalendar(){
  const cm = ui.calMonth || todayISO().slice(0,7);
  const y = +cm.slice(0,4), m = +cm.slice(5,7) - 1;
  const off = (new Date(y, m, 1).getDay() + 6) % 7;
  const inMonth = new Date(y, m + 1, 0).getDate();
  const rows = Math.ceil((off + inMonth) / 7);
  const sel = ui.calDay || todayISO();
  const tk = todayISO();

  let cells = "", monthTasks = 0, monthExams = 0, monthFree = 0;
  for (let i = 0; i < rows * 7; i++){
    const d = new Date(y, m, 1 - off + i), k = key(d);
    const out = d.getMonth() !== m;
    const hol = holidayOn(k), evs = eventsOn(k), exs = examsOn(k);
    const open = Object.values(S.tasks).filter(t => t.due === k && !t.done);
    const free = evs.some(e => e.kind === "Няма университет");
    if (!out){ monthTasks += open.length; monthExams += exs.length; if (hol || free) monthFree++; }
    const dots = [];
    exs.forEach(() => dots.push('<i class="dot exam"></i>'));
    open.slice(0,3).forEach(t => { const su = S.subjects[t.subjectId];
      dots.push(`<i class="dot"${su ? ` style="background:hsl(${su.hue} var(--sc-sat-dot) var(--sc-dot))"` : ""}></i>`); });
    if (evs.length) dots.push('<i class="dot ev"></i>');
    cells += `<button class="cday ${out?"out":""} ${k===tk?"today":""} ${k===sel?"sel":""} ${hol?"hol":""} ${free&&!hol?"free":""}"
      data-act="cal-day" data-d="${k}" aria-label="${d.getDate()} ${MONTHS_FULL[d.getMonth()]}">
      <span class="n">${d.getDate()}</span><span class="dots">${dots.slice(0,4).join("")}</span></button>`;
  }

  const calCol = `<div>
    <div class="calhead">
      <button class="mnav" data-act="cal-prev" aria-label="Предишен месец">${I.chevL}</button>
      <div class="mtitle"><b>${MONTHS_FULL[m]}</b><span>${y}</span></div>
      <button class="mnav" data-act="cal-next" aria-label="Следващ месец">${I.chevR}</button>
      <button class="mnav" data-act="cal-today" aria-label="Към днес" title="Към днес">${I.cal}</button>
    </div>
    <div class="panel" style="padding:11px">
      <div class="calgrid">${CAL_WD.map(w => `<div class="cwd">${w}</div>`).join("")}${cells}</div>
      <div class="callegend">
        <span><i class="dot exam"></i>изпит</span>
        <span><i class="dot"></i>задача</span>
        <span><i class="dot ev"></i>събитие</span>
        <span><i class="sw" style="background:var(--rose-soft); box-shadow:inset 0 0 0 1px var(--rose)"></i>празник</span>
        <span><i class="sw" style="background:var(--amber-soft); box-shadow:inset 0 0 0 1px var(--amber)"></i>няма университет</span>
      </div>
    </div>
  </div>`;

  // ---- избраният ден ----
  const d = parseISO(sel), hol = holidayOn(sel), evs = eventsOn(sel), exs = examsOn(sel);
  const free = evs.filter(e => e.kind === "Няма университет");
  const tasks = Object.values(S.tasks).filter(t => t.due === sel)
    .sort((a,b) => (a.done - b.done) || a.title.localeCompare(b.title,"bg"));
  const doneN = tasks.filter(t => t.done).length;
  const pct = tasks.length ? Math.round(doneN / tasks.length * 100) : 0;

  let inner = "";
  if (hol || free.length){
    inner += `<div class="dnote ${hol ? "rose" : "amber"}">${I.cal}<div>
      <b>${hol && hol.kind === "official" ? "Официален празник" : "Няма университет"}</b>
      <span>${esc(hol ? hol.name : (free[0].title || free[0].kind))}</span></div></div>`;
  }

  inner += `<div class="dsec">
    <div class="sec-head" style="margin-bottom:9px"><p class="eyebrow">Задачи за деня</p>
      <span class="pill ${tasks.length && doneN === tasks.length ? "teal" : tasks.length ? "accent" : ""}">${doneN} / ${tasks.length}</span></div>
    ${tasks.length
      ? barSVG("cal-day", pct, "teal") + `<div class="stack" style="margin-top:11px">${tasks.map(t => taskRow(t, { hideDue:true })).join("")}</div>`
      : `<p class="muted tiny">Няма задача с този срок.</p>`}
  </div>`;

  if (exs.length){
    inner += `<div class="dsec"><div class="sec-head" style="margin-bottom:9px"><p class="eyebrow">Изпити</p>
      <span class="pill accent">${exs.length}</span></div>` + exs.map(su =>
      `<div class="evrow"><span class="mk grad"></span><span class="eb">
        <span class="et">${esc(su.name)}</span>
        <span class="task-meta">${su.exam.form ? `<span class="pill accent">${esc(su.exam.form)}</span>` : ""}
          <span class="pill">готовност ${konPct(su)}%</span></span>
        ${su.exam.material ? `<span class="en">Върху: ${esc(su.exam.material)}</span>` : ""}</span>
      <button class="rowbtn" data-act="open-subject" data-id="${su.id}" aria-label="Отвори предмета">${I.chevR}</button></div>`).join("") + `</div>`;
  }

  if (evs.length){
    inner += `<div class="dsec"><div class="sec-head" style="margin-bottom:9px"><p class="eyebrow">Събития и бележки</p>
      <span class="pill">${evs.length}</span></div>` + evs.map(e =>
      `<div class="evrow"><span class="mk ${eventMark(e.kind)}"></span><span class="eb">
        <span class="et">${esc(e.title || e.kind)}</span>
        ${e.note ? `<span class="en">${esc(e.note)}</span>` : ""}
        <span class="task-meta"><span class="pill ${e.kind === "Няма университет" ? "amber" : "accent"}">${esc(e.kind)}</span></span></span>
      <button class="rowbtn" data-act="edit-event" data-id="${e.id}" aria-label="Промени">${I.pen}</button></div>`).join("") + `</div>`;
  }

  const dayCol = `<div>
    <div class="dstats" style="margin:0 0 12px">
      <div class="dstat">${numSVG("c-t", monthTasks)}<span>задачи</span></div>
      <div class="dstat">${numSVG("c-e", monthExams)}<span>изпити</span></div>
      <div class="dstat">${numSVG("c-f", monthFree)}<span>без университет</span></div>
    </div>
    <div class="panel dayp">
      <div class="dh"><h3>${esc(WEEKDAYS[d.getDay()])}, ${d.getDate()} ${MONTHS_FULL[d.getMonth()]}</h3>
        <span>${sel === tk ? "днес" : esc(fmtDay(sel))}</span></div>
      <div style="margin-top:13px">${inner}</div>
      <div class="dayacts">
        <button class="btn sec" data-act="new-task" data-due="${sel}">${I.plus} Задача</button>
        <button class="btn" data-act="new-event" data-d="${sel}">${I.plus} Събитие</button>
      </div>
    </div>
  </div>`;

  return `<section><div class="calwrap">${calCol}${dayCol}</div></section>`;
}

/* ========== рендер ========== */
let lastKey = null;
function render(){
  const act = document.activeElement;
  const keepId = act && act.id ? act.id : null;
  const caret = keepId && "selectionStart" in act ? act.selectionStart : null;

  const view = document.getElementById("view");
  const k = ui.view + ":" + (ui.subjectId || "") + ":" + (ui.view === "calendar" ? (ui.calMonth || "") : "");
  const fresh = k !== lastKey; lastKey = k;

  const body = ui.view === "today" ? viewToday()
    : ui.view === "subjects" ? viewSubjects()
    : ui.view === "subject" ? viewSubject()
    : ui.view === "tasks" ? viewTasks()
    : ui.view === "calendar" ? viewCalendar() : viewNotes();
  const notice = saveNotice ? `<section><div class="banner" style="background:var(--rose-soft); color:var(--rose)">
    <div><b>Внимание</b>${esc(saveNotice)}</div><button data-act="dismiss-notice">Скрий</button></div></section>` : "";

  view.classList.toggle("anim", fresh);
  view.innerHTML = notice + body;
  renderTabs();
  paintSync();
  settle();
  resolveFiles();

  if (keepId){
    const el = document.getElementById(keepId);
    if (el){ el.focus(); if (caret !== null && "setSelectionRange" in el){ try{ el.setSelectionRange(caret, caret); }catch(e){} } }
  }
}

/* ========== форми ========== */
const overlay = document.getElementById("overlay");
let sheet = null;

function fieldHTML(f){
  const id = "f_"+f.key, lab = `<span>${esc(f.label)}</span>`, hint = f.hint ? `<em class="hint">${esc(f.hint)}</em>` : "";
  if (f.type === "textarea") return `<label class="fld">${lab}<textarea id="${id}" rows="${f.rows||4}" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea>${hint}</label>`;
  if (f.type === "select") return `<label class="fld">${lab}<select id="${id}">${f.options.map(o =>
    `<option value="${esc(o.v)}"${o.v === (f.value||"") ? " selected":""}>${esc(o.l)}</option>`).join("")}</select>${hint}</label>`;
  if (f.type === "date") return `<label class="fld">${lab}<input type="date" id="${id}" value="${esc(f.value||"")}">${hint}</label>`;
  if (f.type === "multi") return `<div class="fld">${lab}<div class="chipset" id="${id}">${f.options.map(o =>
    `<button type="button" class="chip-t${(f.value||[]).indexOf(o) > -1 ? " on":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${hint}</div>`;
  if (f.type === "hue") return `<div class="fld">${lab}<div class="hues" id="${id}">${HUES.map(h =>
    `<button type="button" class="hue${h === f.value ? " on":""}" data-v="${h}" style="--sh:${h}" aria-label="Цвят"></button>`).join("")}</div></div>`;
  if (f.type === "files") return `<div class="fld">${lab}<div class="filebox" id="${id}" data-fkey="${f.key}">
    <div class="filelist"></div>
    ${canUpload() ? `<label class="fileadd">${I.clip}<span>Прикачи файл</span>
      <input type="file" multiple hidden data-fkey="${f.key}"></label>`
     : `<p class="hint">За да качваш файлове, влез в профила си от облачето горе.</p>`}
    <p class="fileerr" hidden></p></div>${hint}</div>`;
  return `<label class="fld">${lab}<input type="text" id="${id}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}">${hint}</label>`;
}
function collect(fields){
  const out = {};
  (fields||[]).forEach(f => {
    const el = document.getElementById("f_"+f.key);
    if (!el) return;
    if (f.type === "multi") out[f.key] = [...el.querySelectorAll(".chip-t.on")].map(b => b.dataset.v);
    else if (f.type === "hue"){ const on = el.querySelector(".hue.on"); out[f.key] = on ? Number(on.dataset.v) : HUES[0]; }
    else if (f.type === "files") out[f.key] = (sheet && sheet.files && sheet.files[f.key]) || [];
    else out[f.key] = typeof el.value === "string" ? el.value.trim() : el.value;
  });
  return out;
}
function paintFiles(k){
  const box = document.querySelector('.filebox[data-fkey="' + k + '"]');
  if (!box || !sheet) return;
  const list = box.querySelector(".filelist");
  const files = sheet.files[k] || [];
  list.innerHTML = files.map((f, i) => `<div class="filerow">${fileGlyph(f)}
    <a class="nm" data-fpath="${esc(f.path)}" href="#" target="_blank" rel="noopener">${esc(f.name)}</a>
    <span class="sz">${esc(fmtSize(f.size))}</span>
    <button class="rowbtn" data-act="file-del" data-fkey="${k}" data-i="${i}" aria-label="Махни файла">${I.x}</button></div>`).join("")
    + Array.from({length: sheet.pending[k] || 0}, () => `<div class="filerow pending">${I.clip}<span class="nm">качва се…</span></div>`).join("");
  resolveFiles();
}
function fileErr(k, msg){
  const box = document.querySelector('.filebox[data-fkey="' + k + '"]');
  if (!box) return;
  const p = box.querySelector(".fileerr");
  p.textContent = msg; p.hidden = !msg;
}
function openSheet(cfg){
  sheet = Object.assign({ armed:false, files:{}, pending:{} }, cfg);
  overlay.innerHTML = `<div class="scrim" data-act="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(cfg.title)}">
      <div class="sheet-head"><div style="flex:1"><h2>${esc(cfg.title)}</h2>${cfg.subtitle?`<p>${esc(cfg.subtitle)}</p>`:""}</div>
        <button class="rowbtn" data-act="close-sheet" aria-label="Затвори">✕</button></div>
      <div class="sheet-body">${cfg.html || (cfg.fields||[]).map(fieldHTML).join("")}</div>
      ${cfg.fields ? `<div class="sheet-foot">
        ${cfg.onDelete ? `<button class="btn danger" data-act="sheet-delete">Изтрий</button>` : ""}
        <button class="btn sec" data-act="close-sheet">Отказ</button>
        <button class="btn" data-act="sheet-save">${esc(cfg.submitLabel||"Запази")}</button></div>` : ""}
    </div>`;
  overlay.hidden = false; overlay.classList.add("on");
  (cfg.fields || []).forEach(f => {
    if (f.type !== "files") return;
    sheet.files[f.key] = (f.value || []).slice();
    sheet.pending[f.key] = 0;
    paintFiles(f.key);
  });
  const first = overlay.querySelector("input:not([type=file]), textarea, select");
  if (first && cfg.focus !== false) setTimeout(() => first.focus(), 80);
}
function closeSheet(){ overlay.classList.remove("on"); overlay.hidden = true; overlay.innerHTML = ""; sheet = null; }

const subjectOptions = () => [{v:"",l:"— без предмет —"}].concat(subjectsSorted().map(s => ({v:s.id, l:s.name})));
function parseKon(text, prev){
  const was = new Map((prev||[]).map(k => [k.t, k]));
  return String(text||"").split("\n").map(s => s.replace(/^\s*\d+\s*[.)\-–]\s*/,"").trim()).filter(Boolean)
    .map(t => { const p = was.get(t); return p ? { t, done:!!p.done, at:p.at||null } : { t, done:false, at:null }; });
}

function subjectSheet(s){
  const isNew = !s;
  s = s || { id:uid(), name:"", teacher:"", hue:HUES[Object.keys(S.subjects).length % HUES.length],
    kinds:["Лекции"], materials:[], materialsNote:"", exam:{}, konspekt:[] };
  const fields = [
    { key:"name", label:"Предмет", value:s.name, placeholder:"напр. Анатомия и физиология на окото" },
    { key:"teacher", label:"Преподавател", value:s.teacher, placeholder:"напр. доц. д-р Иванова" },
    { key:"kinds", type:"multi", label:"Вид занятия", options:KINDS, value:s.kinds||[] },
    { key:"materials", type:"multi", label:"Какво ползваш", options:MATERIALS, value:s.materials||[] },
    { key:"materialsNote", type:"textarea", rows:3, label:"Точно кои материали", value:s.materialsNote,
      placeholder:"напр. учебник „Очна оптика“, том 1 — купен; тетрадка от лекции; презентациите в Moodle",
      hint:"Заглавие, том, откъде е — за да не го търсиш после." },
    { key:"examForm", type:"select", label:"Форма на изпита", options:EXAM_FORMS.map(v => ({v, l:v||"— не е ясно —"})), value:(s.exam||{}).form||"" },
    { key:"examDate", type:"date", label:"Дата на изпита", value:(s.exam||{}).date||"" },
    { key:"examMaterial", type:"textarea", rows:2, label:"Върху какъв материал", value:(s.exam||{}).material||"",
      placeholder:"напр. целият конспект без въпроси 28–34; само лекциите" },
    { key:"hue", type:"hue", label:"Цвят", value:s.hue }
  ];
  openSheet({

/* ---------------- профил и резервно копие ---------------- */
function exportBackup(){
  try{
    const blob = new Blob([JSON.stringify(S, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "medicinski-optik-" + todayISO() + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }catch(e){ alert("Копието не можа да се свали."); }
}
async function doAuth(mode){
  const em = document.getElementById("au_email"), pw = document.getElementById("au_pass"), err = document.getElementById("au_err");
  const show = m => { if (err){ err.textContent = m; err.hidden = !m; } };
  const email = ((em && em.value) || "").trim(), pass = (pw && pw.value) || "";
  show("");
  if (!email || pass.length < 6){ show("Въведи имейл и парола от поне 6 знака."); return; }
  try{
    const r = mode === "up"
      ? await supa.auth.signUp({ email, password:pass })
      : await supa.auth.signInWithPassword({ email, password:pass });
    if (r.error) throw r.error;
    if (mode === "up" && r.data && !r.data.session){
      show("Готово. Потвърди регистрацията от имейла и се върни тук, за да влезеш."); return;
    }
    closeSheet();
    await flush(); await pullAll(); subscribeRealtime(); render();
  }catch(e){ show((e && e.message) ? e.message : "Не се получи. Опитай пак."); }
}
