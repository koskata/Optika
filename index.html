/* ========== събития ========== */
document.addEventListener("click", e => {
  const fa = e.target.closest("a[data-fpath]");
  if (fa && fa.getAttribute("href") === "#"){
    e.preventDefault();
    if (!session) accountSheet();
    return;
  }
  const chip = e.target.closest(".chipset .chip-t");
  if (chip){ chip.classList.toggle("on"); return; }
  const hue = e.target.closest(".hues .hue");
  if (hue){ hue.parentElement.querySelectorAll(".hue").forEach(h => h.classList.remove("on")); hue.classList.add("on"); return; }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;

  switch (a){
    case "tab": ui.view = el.dataset.tab; ui.subjectId = null; window.scrollTo({top:0}); render(); break;
    case "open-subject": ui.view = "subject"; ui.subjectId = id; window.scrollTo({top:0}); render(); break;
    case "settings": settingsSheet(); break;
    case "account": accountSheet(); break;
    case "auth-signin": doAuth("in"); break;
    case "auth-signup": doAuth("up"); break;
    case "auth-signout":
      closeSheet();
      if (supa) supa.auth.signOut().catch(() => {});
      session = null; setSync("local"); render();
      break;
    case "sync-now": closeSheet(); if (supa && session){ flush(); pullAll(); } break;
    case "export": exportBackup(); break;
    case "quick-add": quickAdd(); break;
    case "new-subject": closeSheet(); subjectSheet(null); break;
    case "edit-subject": subjectSheet(S.subjects[id]); break;
    case "del-subject":
      if (el.dataset.armed){ drop("subjects", id); ui.view = "subjects"; render(); }
      else { el.dataset.armed = "1"; el.textContent = "Сигурна ли си? Натисни пак"; }
      break;
    case "edit-kon": konSheet(S.subjects[id]); break;
    case "toggle-kon": {
      const s = S.subjects[id], i = Number(el.dataset.i), was = (s.konspekt||[])[i];
      const kon = (s.konspekt||[]).map((k, j) => j === i ? { t:k.t, done:!k.done, at: !k.done ? Date.now() : null } : k);
      if (was && !was.done){ el.querySelector(".tick").classList.add("just"); burstAt(el.querySelector(".tick")); }
      put("subjects", Object.assign({}, s, { konspekt:kon }));
      break;
    }
    case "learn-next": {
      const s = S.subjects[id], i = (s.konspekt||[]).findIndex(k => !k.done);
      if (i < 0) break;
      const kon = s.konspekt.map((k, j) => j === i ? { t:k.t, done:true, at:Date.now() } : k);
      burstAt(el);
      put("subjects", Object.assign({}, s, { konspekt:kon }));
      break;
    }
    case "new-task": {
      const due = el.dataset.due || (ui.view === "calendar" ? (ui.calDay || todayISO()) : "");
      const subj = el.dataset.subject || (ui.view === "subject" ? ui.subjectId : "");
      closeSheet(); taskSheet(null, subj, due); break;
    }
    case "edit-task": taskSheet(S.tasks[id]); break;
    case "toggle-task": {
      const t = S.tasks[id];
      if (!t.done){ el.classList.add("just"); burstAt(el); }
      put("tasks", Object.assign({}, t, { done:!t.done, completedAt: !t.done ? Date.now() : null }));
      break;
    }
    case "task-filter": ui.taskFilter = el.dataset.filter; render(); break;
    case "subj-sort": ui.subjSort = el.dataset.sort; render(); break;
    case "note-filter": ui.noteSubject = el.dataset.subject; render(); break;
    case "new-note": closeSheet(); noteSheet(null, el.dataset.subject || (ui.view === "subject" ? ui.subjectId : "")); break;
    case "edit-note": noteSheet(S.notes[id]); break;
    case "clear-samples":
      Object.values(S.subjects).filter(s => s.sample).forEach(s => drop("subjects", s.id));
      Object.values(S.tasks).filter(t => t.sample).forEach(t => drop("tasks", t.id));
      Object.values(S.notes).filter(n => n.sample).forEach(n => drop("notes", n.id));
      Object.values(S.events).filter(e => e.sample).forEach(e => drop("events", e.id));
      ui.hideBanner = true; render();
      break;
    case "cal-day": ui.calDay = el.dataset.d; ui.calMonth = el.dataset.d.slice(0,7); render(); break;
    case "cal-prev": case "cal-next": {
      const cm = ui.calMonth || todayISO().slice(0,7);
      const d = new Date(+cm.slice(0,4), +cm.slice(5,7) - 1 + (a === "cal-next" ? 1 : -1), 1);
      ui.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      render(); break;
    }
    case "cal-today": ui.calMonth = todayISO().slice(0,7); ui.calDay = todayISO(); render(); break;
    case "new-event": { const d = el.dataset.d || ""; closeSheet(); eventSheet(null, d); break; }
    case "edit-event": eventSheet(S.events[id]); break;
    case "file-del": {
      if (!sheet) break;
      const k = el.dataset.fkey;
      (sheet.files[k] || []).splice(Number(el.dataset.i), 1);
      paintFiles(k); break;
    }
    case "dismiss-notice": saveNotice = ""; render(); break;
    case "close-sheet": closeSheet(); break;
    case "sheet-save": {
      if (!sheet) break;
      if (sheet.onSubmit(collect(sheet.fields)) !== false) closeSheet();
      break;
    }
    case "sheet-delete":
      if (!sheet || !sheet.onDelete) break;
      if (sheet.armed){ sheet.onDelete(); closeSheet(); render(); }
      else { sheet.armed = true; el.textContent = "Наистина?"; }
      break;
  }
});
document.addEventListener("change", async e => {
  const inp = e.target.closest('input[type="file"][data-fkey]');
  if (!inp || !sheet) return;
  const k = inp.dataset.fkey, picked = [...inp.files];
  inp.value = "";
  if (!canUpload()){ fileErr(k, "Влез в профила си, за да качваш файлове."); return; }
  fileErr(k, "");
  for (const file of picked){
    if (file.size > 25 * 1024 * 1024){ fileErr(k, `„${file.name}“ е над 25 MB и не беше качен.`); continue; }
    sheet.pending[k] = (sheet.pending[k] || 0) + 1; paintFiles(k);
    try{
      const safe = file.name.replace(/[^\w.\-]+/g, "_").slice(-60);
      const path = `${session.user.id}/${uid()}-${safe}`;
      const { error } = await supa.storage.from("files").upload(path, file,
        { contentType: file.type || "application/octet-stream", upsert:false });
      if (error) throw error;
      if (sheet && sheet.files[k]) sheet.files[k].push({ path, name:file.name, type:file.type || "", size:file.size });
    }catch(err){
      fileErr(k, `„${file.name}“ не се качи. Провери връзката и опитай пак.`);
    }finally{
      if (sheet){ sheet.pending[k] = Math.max(0, (sheet.pending[k] || 1) - 1); paintFiles(k); }
    }
  }
});
document.addEventListener("change", e => {
  const inp = e.target.closest("#impfile");
  if (!inp || !inp.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      ["subjects","tasks","notes","events"].forEach(c => {
        Object.values(p[c] || {}).forEach(o => { if (o && o.id) put(c, o); });
      });
      if (p.meta) putMeta(Object.assign({}, p.meta, { seeded:true }));
      closeSheet();
    }catch(err){ alert("Файлът не изглежда като резервно копие."); }
  };
  fr.readAsText(inp.files[0]);
});
document.addEventListener("input", e => { if (e.target.id === "q"){ ui.search = e.target.value; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet(); });

/* ========== старт ========== */
try{ const th = localStorage.getItem("optika.theme"); if (th) document.documentElement.setAttribute("data-theme", th); }catch(e){}

localLoad();
render();
initSync()
  .then(() => { seedIfEmpty(); render(); })
  .catch(() => { setSync("error"); seedIfEmpty(); render(); });

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
